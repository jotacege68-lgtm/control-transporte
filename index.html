
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Jornales</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; color: #333; }
        .cabecera-mes { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .cabecera-mes h2 { margin: 0; color: #1a73e8; font-size: 1.1em; text-transform: uppercase; }
        .flecha { font-size: 1.5em; color: #1a73e8; cursor: pointer; padding: 0 15px; font-weight: bold; }

        .vista-rapida { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .card { background: #1a73e8; color: white; padding: 12px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card h3 { margin: 0 0 5px 0; font-size: 0.8em; opacity: 0.9; }
        .card .info { font-size: 1.1em; font-weight: bold; }
        .card .sub { font-size: 0.8em; margin-top: 3px; opacity: 0.8; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-size: 0.9em; }
        th { background-color: #f8f9fa; color: #666; font-weight: 600; }
        
        .paraliza { color: #d93025; font-weight: bold; background-color: #fce8e6; }
        .enfermo { color: #f29900; font-weight: bold; background-color: #fff4e5; }
        .licencia { color: #188038; font-weight: bold; background-color: #e6f4ea; }

        #formulario-edicion { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); z-index: 10; width: 80%; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn-guardar { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; }
        .btn-cerrar { width: 100%; padding: 10px; background: none; color: #666; border: none; margin-top: 10px; width: 100%; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 5; }
    </style>
</head>
<body>

    <div class="cabecera-mes">
        <div class="flecha" onclick="cambiarMes(-1)">&#10094;</div>
        <h2 id="mes-titulo">Cargando...</h2>
        <div class="flecha" onclick="cambiarMes(1)">&#10095;</div>
    </div>

    <div class="vista-rapida">
        <div class="card">
            <h3>HOY</h3>
            <div id="hoy-dato" class="info">--:--</div>
            <div id="hoy-coche" class="sub">Coche: --</div>
        </div>
        <div class="card" style="background: #5f6368;">
            <h3>MAÑANA</h3>
            <div id="manana-dato" class="info">--:--</div>
            <div id="manana-coche" class="sub">Coche: --</div>
        </div>
    </div>

    <div id="tabla-contenedor"></div>
    <div id="total" style="text-align: center; font-weight: bold; padding: 20px; font-size: 1.2em; color: #1a73e8;"></div>

    <div id="overlay"></div>
    <div id="formulario-edicion">
        <h3 id="fecha-label" style="margin-top:0; color: #1a73e8;">Editar Fecha</h3>
        <input type="text" id="in-coche" placeholder="Coche">
        <input type="text" id="in-ent" placeholder="Entrada" oninput="mascaraHora(this)">
        <input type="text" id="in-sal" placeholder="Salida" oninput="mascaraHora(this)">
        <button class="btn-guardar" onclick="guardar()">GUARDAR</button>
        <button class="btn-cerrar" onclick="cerrar()">CANCELAR</button>
    </div>

<script>
    const dbUrl = "https://gastoscasa-d8bc2-default-rtdb.firebaseio.com/jornales";
    const mesesNombre = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
    const inicialesDias = ["D", "L", "M", "X", "J", "V", "S"];
    
    let hoy = new Date();
    let mesVisible = hoy.getMonth();
    let anioVisible = hoy.getFullYear();

    function mascaraHora(el) {
        let v = el.value.replace(/\D/g, "");
        if (el.value.length > 2 && !el.value.includes(":") && !isNaN(el.value.substring(0,2))) {
            if (v.length > 2) el.value = v.substring(0,2) + ":" + v.substring(2,4);
        }
    }

    async function cargar() {
        const nombreMes = mesesNombre[mesVisible];
        document.getElementById('mes-titulo').innerText = `${nombreMes} ${anioVisible}`;
        
        try {
            const res = await fetch(`${dbUrl}_${nombreMes}_${anioVisible}.json`);
            const datos = await res.json();
            
            if(!datos) {
                document.getElementById('tabla-contenedor').innerHTML = "<p style='text-align:center'>Sin datos.</p>";
                return;
            }

            let html = "<table><tr><th>Día</th><th>Entrada</th><th>Salida</th><th>Coche</th></tr>";
            let suma = 0;
            
            const hoyUyu = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Montevideo"}));
            const hoyStr = hoyUyu.toISOString().split('T')[0];
            const mananaUyu = new Date(hoyUyu); mananaUyu.setDate(hoyUyu.getDate() + 1);
            const mananaStr = mananaUyu.toISOString().split('T')[0];

            Object.keys(datos).sort().forEach(f => {
                const d = datos[f];
                let clase = "";
                const entradaBusq = (d.entrada || "").toUpperCase().trim();
                
                // Cálculo de la inicial del día
                const fechaObj = new Date(f + "T12:00:00"); // Forzamos mediodía para evitar errores de zona horaria
                const inicial = inicialesDias[fechaObj.getDay()];
                
                if(entradaBusq === "PARALIZA") clase = "paraliza";
                else if(entradaBusq === "ENFERMO") clase = "enfermo";
                else if(entradaBusq === "LICENCIA") clase = "licencia";
                
                suma += parseFloat(d.jornal || 0);

                if(f === hoyStr) {
                    document.getElementById('hoy-dato').innerText = d.entrada + " / " + d.salida;
                    document.getElementById('hoy-coche').innerText = "Coche: " + d.coche;
                }
                if(f === mananaStr) {
                    document.getElementById('manana-dato').innerText = d.entrada + " / " + d.salida;
                    document.getElementById('manana-coche').innerText = "Coche: " + d.coche;
                }

                html += `<tr onclick="abrir('${f}', '${d.coche}', '${d.entrada}', '${d.salida}')">
                    <td><strong>${f.split('-')[2]}</strong> <small>${inicial}</small></td>
                    <td class="${clase}">${d.entrada}</td>
                    <td>${d.salida}</td>
                    <td>${d.coche}</td>
                </tr>`;
            });
            document.getElementById('tabla-contenedor').innerHTML = html + "</table>";
            document.getElementById('total').innerText = "Total Jornales: " + suma.toFixed(1);
        } catch(e) { console.error(e); }
    }

    window.cambiarMes = (dir) => {
        mesVisible += dir;
        if(mesVisible > 11) { mesVisible = 0; anioVisible++; }
        if(mesVisible < 0) { mesVisible = 11; anioVisible--; }
        cargar();
    }

    let editando = "";
    window.abrir = (f, c, e, s) => {
        editando = f;
        document.getElementById('fecha-label').innerText = "Fecha: " + f;
        document.getElementById('in-coche').value = c;
        document.getElementById('in-ent').value = e;
        document.getElementById('in-sal').value = s;
        document.getElementById('formulario-edicion').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    window.cerrar = () => {
        document.getElementById('formulario-edicion').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    window.guardar = async () => {
        const ent = document.getElementById('in-ent').value.trim();
        const sal = document.getElementById('in-sal').value.trim();
        const entUpper = ent.toUpperCase();
        const palabrasNoJornal = ["PARALIZA", "ENFERMO", "LICENCIA", "SIN SERVICIO", "FERIADO"];
        const jor = palabrasNoJornal.includes(entUpper) ? 0.0 : 1.0;

        const body = { 
            coche: document.getElementById('in-coche').value,
            entrada: ent,
            salida: sal,
            jornal: jor,
            carton: "MANUAL"
        };

        const mesPath = `${mesesNombre[mesVisible]}_${anioVisible}`;
        await fetch(`${dbUrl}_${mesPath}/${editando}.json`, { method: 'PATCH', body: JSON.stringify(body) });
        cerrar();
        cargar();
    }
    cargar();
</script>
</body>
</html>
