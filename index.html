<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HORARIOS JC TRABAJO</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --p: #2c3e50; --s: #2980b9; --bg: #fdfdfd; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); color: #333; }
        
        .header-main { background: #1a252f; color: #ecf0f1; padding: 20px; text-align: center; font-size: 1.5em; font-weight: bold; }

        .nav-tabs { display: flex; background: #fff; border-bottom: 3px solid #eee; position: sticky; top: 0; z-index: 100; }
        .tab { flex: 1; padding: 20px 10px; text-align: center; cursor: pointer; font-size: 1.2em; font-weight: 900; color: #95a5a6; border-bottom: 4px solid transparent; transition: 0.3s; }
        .tab.active { color: var(--s); border-bottom: 4px solid var(--s); background: #f9f9f9; }

        .content { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card-dia { background: white; border: 2px solid #eee; border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .dia-titulo { font-size: 1.1em; color: var(--s); font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .big-info { font-size: 2.8em; font-weight: 800; color: #2c3e50; line-height: 1.1; margin: 10px 0; }
        .sub-info { font-size: 1.4em; color: #7f8c8d; }

        .table-container { overflow-x: auto; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { background: #f8f9fa; color: #2c3e50; padding: 12px; border-bottom: 2px solid #dee2e6; text-align: left; }
        td { padding: 15px 12px; border-bottom: 1px solid #eee; font-size: 1em; }
        .hoy-row { background: #e3f2fd !important; font-weight: bold; border-left: 5px solid var(--s); }

        .mes-control { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #eee; padding: 10px; border-radius: 8px; }
        .btn-nav { background: var(--p); color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header-main">HORARIOS JC TRABAJO</div>

<div class="nav-tabs">
    <div class="tab active" onclick="showTab('tab-dia', this)">DÍA</div>
    <div class="tab" onclick="showTab('tab-mes', this)">LISTA</div>
    <div class="tab" onclick="showTab('tab-jornales', this)">JORNALES</div>
</div>

<div id="tab-dia" class="content active">
    <div id="container-hoy"></div>
    <div id="container-manana"></div>
</div>

<div id="tab-mes" class="content">
    <div class="mes-control">
        <button class="btn-nav" onclick="cambiarMes(-1)">◀</button>
        <span id="mes-actual-label" style="font-weight:bold; font-size: 1.2em;">ENERO 2026</span>
        <button class="btn-nav" onclick="cambiarMes(1)">▶</button>
    </div>
    <div class="table-container" id="lista-mes-html"></div>
</div>

<div id="tab-jornales" class="content">
    <div class="card-dia" style="text-align: center;">
        <div class="dia-titulo">TOTAL ACUMULADO</div>
        <div class="big-info" id="num-jornales" style="font-size: 4em; color: #27ae60;">0.0</div>
        <div class="sub-info">Jornales cobrados</div>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBDlHjKXf33pCEznyLAmFrTDXVPeVrH e9Q",
  authDomain: "gastoscasa-d8bc2.firebaseapp.com",
  databaseURL: "https://gastoscasa-d8bc2-default-rtdb.firebaseio.com",
  projectId: "gastoscasa-d8bc2",
  storageBucket: "gastoscasa-d8bc2.firebasestorage.app",
  messagingSenderId: "749635992986",
  appId: "1:749635992986:web:7916d888f54eb5c3ab0e23"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let fechaGlobal = new Date();
let mesActual = fechaGlobal.getMonth() + 1;
let anioActual = fechaGlobal.getFullYear();

const nombresMeses = ["", "enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const diasSemana = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

function showTab(id, el) {
    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
}

function obtenerNombreDia(fechaStr) {
    const d = new Date(fechaStr + "T00:00:00");
    return diasSemana[d.getDay()];
}

function calcularJornal(entrada, salida) {
    if(!entrada || !salida || entrada.includes('?') || entrada.includes('-') || entrada === "A confirmar") return 0;
    const [h1, m1] = entrada.split(':').map(Number);
    const [h2, m2] = salida.split(':').map(Number);
    if (isNaN(h1) || isNaN(h2)) return 0;
    let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (diff < 0) diff += 1440;
    return diff < 240 ? 0.5 : 1.0;
}

function cargar() {
    const mesStr = `${mesActual < 10 ? '0'+mesActual : mesActual}_${nombresMeses[mesActual]}`;
    document.getElementById('mes-actual-label').innerText = `${nombresMeses[mesActual].toUpperCase()} ${anioActual}`;
    
    db.ref(`transporte/${anioActual}/${mesStr}`).on('value', snapshot => {
        const data = snapshot.val() || {};
        renderizar(data);
    });
}

function renderizar(data) {
    let html = `<table><tr><th>Día</th><th>Cartón</th><th>Entra</th><th>Sale</th></tr>`;
    let totalJ = 0;
    const hoyStr = new Date().toISOString().split('T')[0];
    const manana = new Date(); manana.setDate(manana.getDate() + 1);
    const mananaStr = manana.toISOString().split('T')[0];

    Object.keys(data).sort().forEach(fecha => {
        const d = data[fecha];
        const nomDia = obtenerNombreDia(fecha);
        const esHoy = fecha === hoyStr;
        
        let entra = d.hora_entrada;
        // Cambiado a ???? según pedido
        let sale = d.hora_salida || (nomDia === "Sáb" || nomDia === "Dom" ? "PARALIZA" : "????");
        
        const j = (d.lugar === "PARALIZA" || d.lugar === "LIBRE" || d.lugar === "DESCANSO") ? 0 : (d.jornal || calcularJornal(entra, sale));
        totalJ += parseFloat(j);

        html += `<tr class="${esHoy ? 'hoy-row' : ''}">
            <td>${fecha.split('-')[2]} <small>${nomDia}</small></td>
            <td>${d.carton}</td>
            <td onclick="edit('${fecha}','hora_entrada','${entra}')">${entra}</td>
            <td onclick="edit('${fecha}','hora_salida','${sale}')">${sale}</td>
        </tr>`;

        if(esHoy) actualizarVistaDia('container-hoy', "HOY", nomDia, d, entra, sale);
        if(fecha === mananaStr) actualizarVistaDia('container-manana', "MAÑANA", nomDia, d, entra, sale);
    });

    document.getElementById('lista-mes-html').innerHTML = html + `</table>`;
    document.getElementById('num-jornales').innerText = totalJ.toFixed(1);
}

function actualizarVistaDia(id, titulo, nomDia, d, entra, sale) {
    document.getElementById(id).innerHTML = `
        <div class="card-dia">
            <div class="dia-titulo">${titulo} (${nomDia})</div>
            <div class="big-info">${entra}</div>
            <div class="sub-info">Sale: ${sale} | Cartón ${d.carton}</div>
            <div style="margin-top:5px; color:#2980b9; font-weight:bold;">${d.lugar}</div>
        </div>`;
}
