<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Jornales - Enero 2026</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 10px; }
        h2 { text-align: center; color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
        th { background-color: #007bff; color: white; }
        .paraliza { color: red; font-weight: bold; }
        .jornal-total { font-size: 1.2em; font-weight: bold; text-align: right; padding: 20px; }
    </style>
</head>
<body>

<h2>Enero 2026 - Coche 1089</h2>
<div id="tabla-contenedor">Cargando datos de Firebase...</div>
<div class="jornal-total" id="total"></div>

<script type="module">
    // Configuración de tu Firebase (Sustituye con tus datos si es necesario)
    const dbUrl = "https://gastoscasa-d8bc2-default-rtdb.firebaseio.com/jornales_enero_2026.json";

    async function cargarDatos() {
        const respuesta = await fetch(dbUrl);
        const datos = await respuesta.json();
        
        let tablaHtml = "<table><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Jornal</th></tr>";
        let totalJornales = 0;

        for (const fecha in datos) {
            const d = datos[fecha];
            const esParaliza = d.entrada === "PARALIZA";
            totalJornales += d.jornal;

            tablaHtml += `<tr>
                <td>${fecha.split('-')[2]}/${fecha.split('-')[1]}</td>
                <td class="${esParaliza ? 'paraliza' : ''}">${d.entrada}</td>
                <td>${d.salida}</td>
                <td>${d.jornal}</td>
            </tr>`;
        }

        tablaHtml += "</table>";
        document.getElementById('tabla-contenedor').innerHTML = tablaHtml;
        document.getElementById('total').innerHTML = "Total Jornales: " + totalJornales;
    }

    cargarDatos();
</script>
</body>
</html>
